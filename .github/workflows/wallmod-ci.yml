name: WallMod CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Release]

    runs-on: ${{ matrix.os }}

    env:
      Solution_Name: WallMod.sln
      Test_Project_Path: tests/WallModTest/WallModTest.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    # shows which SDK is actually being used (the runner has extra ones preinstalled)
    - name: .NET info
      run: dotnet --info

    - name: Restore
      run: dotnet restore ${{ env.Solution_Name }}

    # -v normal + -tl:off = full plain-text output, so a failure shows its real error
    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore -v normal -tl:off

    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-build
